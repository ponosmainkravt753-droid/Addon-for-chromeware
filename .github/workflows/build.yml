
name: Build Minecraft Addon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle build
          else
            echo "Gradle project not found"
            exit 1
          fi

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: build/libs/*.jar
          if-no-files-found: error
